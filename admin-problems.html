<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Problem Box</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
  .problem-item{ border-bottom:1px solid var(--line); padding:16px 0; }
  .problem-item:last-child{ border-bottom:none; }
  .problem-meta{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; flex-wrap:wrap; gap:8px; }
  .problem-who{ font-weight:600; font-size:14px; }
  .problem-contact{ font-size:12.5px; color:var(--muted); }
  .problem-date{ font-size:12px; color:var(--muted); }
  .problem-msg{ font-size:13.5px; line-height:1.5; margin-top:4px; }
  .status-select{ font-size:12px; padding:4px 8px; border-radius:6px; border:1.5px solid var(--line); }
</style>
</head>
<body>
<div class="app-shell">
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand"><i class="fa-solid fa-hotel"></i> Admin Panel</div>
  <nav class="sidebar-nav">
    <a href="admin.html" class="nav-link"><i class="fa-solid fa-gauge-high"></i><span>Overview</span></a>
    <a href="admin-admissions.html" class="nav-link"><i class="fa-solid fa-user-graduate"></i><span>Student Admission</span></a>
    <a href="admin-payments.html" class="nav-link"><i class="fa-solid fa-money-bill-transfer"></i><span>Payment Details</span></a>
    <a href="admin-payment-history.html" class="nav-link"><i class="fa-solid fa-clock-rotate-left"></i><span>Payment History</span></a>
    <a href="admin-student-info.html" class="nav-link"><i class="fa-solid fa-circle-info"></i><span>Student Info</span></a>
    <a href="admin-payment-chart.html" class="nav-link"><i class="fa-solid fa-chart-column"></i><span>Payment Chart</span></a>
    <a href="admin-spending.html" class="nav-link"><i class="fa-solid fa-house-chimney"></i><span>Spending</span></a>
    <a href="admin-spending-history.html" class="nav-link"><i class="fa-solid fa-receipt"></i><span>Spending History</span></a>
    <a href="admin-income.html" class="nav-link"><i class="fa-solid fa-sack-dollar"></i><span>Income Details</span></a>
    <a href="admin-income-history.html" class="nav-link"><i class="fa-solid fa-file-invoice-dollar"></i><span>Income History</span></a>
    <a href="admin-profit-chart.html" class="nav-link"><i class="fa-solid fa-chart-line"></i><span>Profit Chart</span></a>
    <a href="admin-problems.html" class="nav-link active"><i class="fa-solid fa-triangle-exclamation"></i><span>Problem Box</span></a>
  </nav>
  <div class="sidebar-footer">
    <div class="sidebar-footer-label">Logged in as</div>
    <div class="sidebar-footer-role">Administrator</div>
  </div>
</aside>
<div class="main-area">
<nav class="topnav">
  <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu"><i class="fa-solid fa-bars"></i></button>
  <div class="topnav-search">
    <input type="text" placeholder="Search for...">
    <button type="button"><i class="fa-solid fa-magnifying-glass"></i></button>
  </div>
  <button class="logout-btn" id="logoutBtn"><i class="fa-solid fa-arrow-right-from-bracket"></i> Log out</button>
</nav>
<div class="content-area">

<div id="loadingState" class="loading">Loading...</div>

<div class="page wide hidden" id="mainContent">
  <div class="card">
    <h2>Problem Box</h2>
    <p class="sub">Messages students have sent, newest first.</p>
    <div id="problemList"></div>
    <div class="empty hidden" id="problemEmpty">No messages yet.</div>
  </div>
</div>


</div><!-- content-area -->
</div><!-- main-area -->
</div><!-- app-shell -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const sidebarToggleBtn = document.getElementById('sidebarToggle');
const sidebarEl = document.getElementById('sidebar');
const sidebarBackdropEl = document.getElementById('sidebarBackdrop');
if(sidebarToggleBtn){
  sidebarToggleBtn.addEventListener('click', ()=>{
    sidebarEl.classList.toggle('open');
    sidebarBackdropEl.classList.toggle('open');
  });
  sidebarBackdropEl.addEventListener('click', ()=>{
    sidebarEl.classList.remove('open');
    sidebarBackdropEl.classList.remove('open');
  });
}
</script>

<script>
document.getElementById('logoutBtn').addEventListener('click', ()=>{ auth.signOut().then(()=> window.location.href = 'login.html'); });

auth.onAuthStateChanged(async (user)=>{
  if(!user){ window.location.href = 'login.html'; return; }

  const adminDoc = await db.collection('admins').doc(user.uid).get();
  if(!adminDoc.exists){
    alert('This account is not an admin.');
    await auth.signOut();
    window.location.href = 'login.html';
    return;
  }

  document.getElementById('loadingState').classList.add('hidden');
  document.getElementById('mainContent').classList.remove('hidden');
  loadProblems();
});

async function loadProblems(){
  const list = document.getElementById('problemList');
  const empty = document.getElementById('problemEmpty');
  list.innerHTML = '';

  const snap = await db.collection('problems').orderBy('submittedAt','desc').get();
  if(snap.empty){
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  snap.forEach(doc=>{
    const p = doc.data();
    let dateLabel = '';
    if(p.submittedAt && p.submittedAt.toDate) dateLabel = p.submittedAt.toDate().toLocaleString();

    const item = document.createElement('div');
    item.className = 'problem-item';
    item.innerHTML = `
      <div class="problem-meta">
        <div>
          <div class="problem-who">${p.studentName || '(unnamed)'}</div>
          <div class="problem-contact">${p.phone || ''}</div>
        </div>
        <div style="text-align:right;">
          <div class="problem-date">${dateLabel}</div>
          <select class="status-select" data-id="${doc.id}">
            <option value="New" ${p.status === 'New' ? 'selected' : ''}>New</option>
            <option value="In Progress" ${p.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
            <option value="Resolved" ${p.status === 'Resolved' ? 'selected' : ''}>Resolved</option>
          </select>
        </div>
      </div>
      <div class="problem-msg">${p.message}</div>
    `;
    list.appendChild(item);
  });

  document.querySelectorAll('.status-select').forEach(sel=>{
    sel.addEventListener('change', async ()=>{
      const id = sel.getAttribute('data-id');
      await db.collection('problems').doc(id).update({ status: sel.value });
    });
  });
}
</script>
</body>
</html>
