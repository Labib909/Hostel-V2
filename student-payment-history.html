<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1d2e">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hostel Portal">
<title>Payment History</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand"><i class="fa-solid fa-hotel"></i> Student Portal</div>
  <nav class="sidebar-nav">
    <a href="student.html" class="nav-link"><i class="fa-solid fa-house"></i><span>Home</span></a>
  </nav>
  <div class="sidebar-footer">
    <div class="sidebar-footer-label">Logged in as</div>
    <div class="sidebar-footer-role">Student</div>
  </div>
</aside>
<div class="main-area">
<nav class="topnav">
  <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu"><i class="fa-solid fa-bars"></i></button>
  <div class="topnav-search">
    <input type="text" placeholder="Search for...">
    <button type="button"><i class="fa-solid fa-magnifying-glass"></i></button>
  </div>
</nav>
<div class="content-area">

<div id="loadingState" class="loading">Loading...</div>

<div class="page hidden" id="mainContent">
  <p style="margin-bottom:20px;"><a class="back" href="student.html">&larr; Back</a></p>

  <div class="card">
    <h2>My Payment History</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Type</th><th>For Month</th><th>Amount</th><th>Method</th><th>Details</th><th>Status</th></tr></thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
    <div class="empty hidden" id="historyEmpty">No payments submitted yet.</div>
  </div>
</div>


</div><!-- content-area -->
</div><!-- main-area -->
</div><!-- app-shell -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const sidebarToggleBtn = document.getElementById('sidebarToggle');
const sidebarEl = document.getElementById('sidebar');
const sidebarBackdropEl = document.getElementById('sidebarBackdrop');
if(sidebarToggleBtn){
  sidebarToggleBtn.addEventListener('click', ()=>{
    sidebarEl.classList.toggle('open');
    sidebarBackdropEl.classList.toggle('open');
  });
  sidebarBackdropEl.addEventListener('click', ()=>{
    sidebarEl.classList.remove('open');
    sidebarBackdropEl.classList.remove('open');
  });
}
</script>

<script>
let currentUid = null;

// Logout now lives only on the student home page (student.html)

auth.onAuthStateChanged(async (user)=>{
  if(!user){ window.location.href = 'login.html'; return; }
  currentUid = user.uid;

  document.getElementById('loadingState').classList.add('hidden');
  document.getElementById('mainContent').classList.remove('hidden');
  loadHistory();
});

async function loadHistory(){
  const body = document.getElementById('historyBody');
  const empty = document.getElementById('historyEmpty');
  body.innerHTML = '';

  try{
    // No orderBy here on purpose — a where()+orderBy() combo needs a Firestore
    // composite index that doesn't exist by default. We sort client-side instead.
    const snap = await db.collection('payments').where('studentUid','==',currentUid).get();

    if(snap.empty){
      empty.classList.remove('hidden');
      return;
    }
    empty.classList.add('hidden');

    const rows = [];
    snap.forEach(doc=> rows.push(doc.data()));
    rows.sort((a,b)=>{
      const ta = a.submittedAt && a.submittedAt.toDate ? a.submittedAt.toDate().getTime() : 0;
      const tb = b.submittedAt && b.submittedAt.toDate ? b.submittedAt.toDate().getTime() : 0;
      return tb - ta;
    });

    rows.forEach(p=>{
      const d = new Date(p.forMonth + '-01');
      const label = d.toLocaleString('en-US', { month:'long', year:'numeric' });
      let details = '—';
      if(p.method === 'bKash'){
        const parts = [];
        if(p.txnId) parts.push('ID: ' + p.txnId);
        if(p.txnPhone) parts.push('Ph: ' + p.txnPhone);
        details = parts.join(' / ') || '—';
      }else if(p.method === 'Person'){
        details = 'Paid to ' + (p.personName || '—');
      }
      const pillClass = p.status === 'Received' ? 'pill-received' : 'pill-pending';
      const row = document.createElement('tr');
      const typeLabel = p.paymentType === 'admission' ? 'Admission Fee' : 'Monthly Fee';
      row.innerHTML = `<td>${typeLabel}</td><td>${label}</td><td>৳${p.amount}</td><td>${p.method}</td><td>${details}</td><td><span class="pill ${pillClass}">${p.status || 'Pending'}</span></td>`;
      body.appendChild(row);
    });
  }catch(err){
    empty.textContent = "Couldn't load payment history right now. Please refresh and try again.";
    empty.classList.remove('hidden');
  }
}
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
