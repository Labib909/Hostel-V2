<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Chart</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar">
  <div class="brand">Admin Panel</div>
  <div class="nav">
    <a href="admin.html">Overview</a>
    <a href="admin-admissions.html">Student Admission</a>
    <a href="admin-payments.html">Payment Details</a>
    <a href="admin-admission-fee.html">Admission Fee</a>
    <a href="admin-payment-chart.html" class="active">Payment Chart</a>
    <a href="admin-problems.html">Problem Box</a>
  </div>
  <button class="logout-btn" id="logoutBtn">Log out</button>
</div>

<div id="loadingState" class="loading">Loading...</div>

<div class="page wide hidden" id="mainContent">

  <div class="card">
    <h2>Deposit</h2>
    <p class="sub">Who paid, month by month. "Paid" means the payment has been marked Received.</p>
    <div class="table-wrap">
      <table class="chart-table" id="depositTable">
        <thead><tr id="depositHeadRow"></tr></thead>
        <tbody id="depositBody"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h2>Debt</h2>
    <p class="sub">Unpaid months show the amount owed (&#2547;2500). Paid months show a &#9679;.</p>
    <div class="table-wrap">
      <table class="chart-table" id="debtTable">
        <thead><tr id="debtHeadRow"></tr></thead>
        <tbody id="debtBody"></tbody>
      </table>
    </div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
document.getElementById('logoutBtn').addEventListener('click', ()=>{ auth.signOut().then(()=> window.location.href = 'login.html'); });

// Change these if your term starts in a different month, or the monthly fee changes.
const START_YEAR = 2026;
const START_MONTH = 7; // July
const MONTHLY_FEE = 2500;

function buildMonthRange(){
  const months = [];
  const now = new Date();
  let y = START_YEAR, m = START_MONTH;
  while(y < now.getFullYear() || (y === now.getFullYear() && m <= now.getMonth()+1)){
    months.push({ key: y + '-' + String(m).padStart(2,'0'), label: new Date(y, m-1, 1).toLocaleString('en-US',{month:'short'}) + ' (' + y + ')' });
    m++;
    if(m > 12){ m = 1; y++; }
  }
  return months;
}

auth.onAuthStateChanged(async (user)=>{
  if(!user){ window.location.href = 'login.html'; return; }

  const adminDoc = await db.collection('admins').doc(user.uid).get();
  if(!adminDoc.exists){
    alert('This account is not an admin.');
    await auth.signOut();
    window.location.href = 'login.html';
    return;
  }

  const studentsSnap = await db.collection('students').get();
  const students = [];
  studentsSnap.forEach(doc=> students.push({ uid: doc.id, ...doc.data() }));
  students.sort((a,b)=> (a.rollNumber||'').localeCompare(b.rollNumber||''));

  const paymentsSnap = await db.collection('payments').where('status','==','Received').get();
  const paidSet = new Set(); // "uid|forMonth"
  paymentsSnap.forEach(doc=>{
    const p = doc.data();
    paidSet.add(p.studentUid + '|' + p.forMonth);
  });

  const months = buildMonthRange();

  // Deposit table
  const depositHead = document.getElementById('depositHeadRow');
  depositHead.innerHTML = '<th>Roll</th><th>Name</th>' + months.map(m=>`<th>${m.label}</th>`).join('');
  const depositBody = document.getElementById('depositBody');
  depositBody.innerHTML = '';

  // Debt table
  const debtHead = document.getElementById('debtHeadRow');
  debtHead.innerHTML = '<th>Roll</th><th>Name</th>' + months.map(m=>`<th>${m.label}</th>`).join('');
  const debtBody = document.getElementById('debtBody');
  debtBody.innerHTML = '';

  students.forEach(s=>{
    const depositRow = document.createElement('tr');
    let depositCells = `<td>${s.rollNumber || '—'}</td><td>${s.fullname || '(unnamed)'}</td>`;
    let debtCells = `<td>${s.rollNumber || '—'}</td><td>${s.fullname || '(unnamed)'}</td>`;

    months.forEach(m=>{
      const paid = paidSet.has(s.uid + '|' + m.key);
      depositCells += `<td>${paid ? 'Paid' : '<span class="dash">-</span>'}</td>`;
      debtCells += `<td>${paid ? '<span class="dot-paid">&#9679;</span>' : '৳' + MONTHLY_FEE}</td>`;
    });

    depositRow.innerHTML = depositCells;
    depositBody.appendChild(depositRow);

    const debtRow = document.createElement('tr');
    debtRow.innerHTML = debtCells;
    debtBody.appendChild(debtRow);
  });

  document.getElementById('loadingState').classList.add('hidden');
  document.getElementById('mainContent').classList.remove('hidden');
});
</script>
</body>
</html>
