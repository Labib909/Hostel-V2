<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1d2e">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hostel Portal">
<title>Change Password</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand"><i class="fa-solid fa-hotel"></i> Student Portal</div>
  <nav class="sidebar-nav">
    <a href="student.html" class="nav-link"><i class="fa-solid fa-house"></i><span>Home</span></a>
  </nav>
  <div class="sidebar-footer">
    <div class="sidebar-footer-label">Logged in as</div>
    <div class="sidebar-footer-role">Student</div>
  </div>
</aside>
<div class="main-area">
<nav class="topnav">
  <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu"><i class="fa-solid fa-bars"></i></button>
  <div class="sidebar-brand"><i class="fa-solid fa-hotel"></i> VIP লেডিস হোস্টেল</div>
</nav>
<div class="content-area">

<div id="loadingState" class="loading">Loading...</div>

<div class="page hidden" id="mainContent">
  <p style="margin-bottom:20px;"><a class="back" href="student.html">&larr; Back</a></p>

  <div class="card">
    <h1>Change Password</h1>
    <p class="sub">You'll need your current password to set a new one.</p>

    <form id="passwordForm" novalidate>
      <div class="field" data-field="current">
        <label>Current password</label>
        <input type="password" id="currentPassword">
        <div class="err">Please enter your current password.</div>
      </div>
      <div class="field" data-field="new">
        <label>New password</label>
        <input type="password" id="newPassword" placeholder="At least 6 characters">
        <div class="err">New password must be at least 6 characters.</div>
      </div>
      <div class="field" data-field="confirm">
        <label>Confirm new password</label>
        <input type="password" id="confirmPassword">
        <div class="err">Passwords don't match.</div>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">Update Password</button>
      <div class="status" id="statusMsg"></div>
    </form>
  </div>
</div>


</div><!-- content-area -->
</div><!-- main-area -->
</div><!-- app-shell -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const sidebarToggleBtn = document.getElementById('sidebarToggle');
const sidebarEl = document.getElementById('sidebar');
const sidebarBackdropEl = document.getElementById('sidebarBackdrop');
if(sidebarToggleBtn){
  sidebarToggleBtn.addEventListener('click', ()=>{
    sidebarEl.classList.toggle('open');
    sidebarBackdropEl.classList.toggle('open');
  });
  sidebarBackdropEl.addEventListener('click', ()=>{
    sidebarEl.classList.remove('open');
    sidebarBackdropEl.classList.remove('open');
  });
}
</script>

<script>
let currentUser = null;
let currentPhone = null;

// Logout now lives only on the student home page (student.html)

auth.onAuthStateChanged(async (user)=>{
  if(!user){ window.location.href = 'login.html'; return; }
  currentUser = user;

  const doc = await db.collection('students').doc(user.uid).get();
  if(doc.exists){
    currentPhone = doc.data().phone || doc.data().phoneLogin || '';
  }

  document.getElementById('loadingState').classList.add('hidden');
  document.getElementById('mainContent').classList.remove('hidden');
});

function markValid(el){ el.classList.remove('invalid'); }
function markInvalid(el){ el.classList.add('invalid'); }

document.getElementById('passwordForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const form = this;
  let valid = true;
  const statusMsg = document.getElementById('statusMsg');
  statusMsg.style.display = 'none';

  const current = document.getElementById('currentPassword').value;
  const currentField = form.querySelector('[data-field="current"]');
  if(!current){ markInvalid(currentField); valid = false; } else { markValid(currentField); }

  const newPass = document.getElementById('newPassword').value;
  const newField = form.querySelector('[data-field="new"]');
  if(!newPass || newPass.length < 6){ markInvalid(newField); valid = false; } else { markValid(newField); }

  const confirm = document.getElementById('confirmPassword').value;
  const confirmField = form.querySelector('[data-field="confirm"]');
  if(confirm !== newPass || !confirm){ markInvalid(confirmField); valid = false; } else { markValid(confirmField); }

  if(!valid) return;

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Updating...';

  try{
    const authEmail = phoneToAuthEmail(currentPhone);
    const cred = firebase.auth.EmailAuthProvider.credential(authEmail, current);
    await currentUser.reauthenticateWithCredential(cred);
    await currentUser.updatePassword(newPass);

    // Keep the admin-visible copy in sync
    await db.collection('students').doc(currentUser.uid).update({ passwordPlain: newPass });

    statusMsg.textContent = 'Password updated successfully.';
    statusMsg.className = 'status ok';
    statusMsg.style.display = 'block';
    form.reset();
  }catch(err){
    let msg = 'Something went wrong. Please try again.';
    if(err.code === 'auth/wrong-password') msg = 'Your current password is incorrect.';
    statusMsg.textContent = msg;
    statusMsg.className = 'status error';
    statusMsg.style.display = 'block';
  }
  btn.disabled = false; btn.textContent = 'Update Password';
});
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
