<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Form</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar">
  <div class="brand">Student Portal</div>
  <button class="logout-btn" id="logoutBtn">Log out</button>
</div>

<div id="loadingState" class="loading">Loading...</div>

<div class="page hidden" id="mainContent">
  <p style="margin-bottom:20px;"><a class="back" href="student.html">&larr; Back</a></p>

  <div class="card">
    <h2>Make a Payment</h2>
    <div class="status error" id="blockedNotice" style="display:none; text-align:left; margin-bottom:16px;"></div>

    <form id="paymentForm" novalidate>
      <div class="field" data-field="forMonth">
        <label>Which month is this payment for?</label>
        <select id="p_forMonth"></select>
      </div>

      <div class="field" data-field="method">
        <label>Payment method</label>
        <div class="radio-group">
          <label class="radio-pill" id="methodBkashOpt"><input type="radio" name="method" value="bKash" id="method_bkash">bKash</label>
          <label class="radio-pill" id="methodPersonOpt"><input type="radio" name="method" value="Person" id="method_person">Person</label>
        </div>
        <div class="err">Please choose a payment method.</div>
      </div>

      <div id="bkashFields" class="hidden">
        <p class="sub" style="margin:-6px 0 14px;">Fill in the transaction ID or the phone number used — at least one, both is fine too.</p>
        <div class="field" data-field="txnId">
          <label>Transaction ID <span class="optional">(fill this or the phone number below)</span></label>
          <input type="text" id="p_txnId">
        </div>
        <div class="field" data-field="txnPhone">
          <label>Transaction phone number <span class="optional">(fill this or the ID above)</span></label>
          <input type="tel" id="p_txnPhone">
        </div>
        <div class="err" id="bkashErr" style="display:none; color:var(--error); font-size:12px; margin:-10px 0 16px;">Please fill in the transaction ID or the phone number.</div>
      </div>

      <div id="personFields" class="hidden">
        <div class="field" data-field="personName">
          <label>Paid to</label>
          <select id="p_personName">
            <option value="">Select a person</option>
            <option value="Mithila">Mithila</option>
            <option value="Sudebi">Sudebi</option>
          </select>
          <div class="err">Please select who you paid.</div>
        </div>
      </div>

      <div class="field" data-field="amount">
        <label>Amount (&#2547;)</label>
        <input type="number" id="p_amount" min="1">
        <div class="err">Please enter a valid amount.</div>
      </div>

      <button type="submit" class="submit-btn teal" id="paymentSubmitBtn">Submit Payment</button>
      <div class="status" id="paymentStatus"></div>
    </form>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
let currentUid = null;
let currentStudentData = null;
let approvedMonthsSet = new Set();

document.getElementById('logoutBtn').addEventListener('click', ()=>{ auth.signOut().then(()=> window.location.href = 'login.html'); });

function monthLabel(offset){
  const d = new Date(); d.setMonth(d.getMonth() + offset);
  return d.toLocaleString('en-US', { month: 'long', year: 'numeric' });
}
function monthKey(offset){
  const d = new Date(); d.setMonth(d.getMonth() + offset);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}

auth.onAuthStateChanged(async (user)=>{
  if(!user){ window.location.href = 'login.html'; return; }
  currentUid = user.uid;

  const doc = await db.collection('students').doc(currentUid).get();
  if(!doc.exists){
    alert('No student profile found for this account. Contact the admin.');
    await auth.signOut();
    window.location.href = 'login.html';
    return;
  }
  currentStudentData = doc.data();

  // Load which months already have a Received payment, to block re-paying them
  try{
    const snap = await db.collection('payments').where('studentUid','==',currentUid).get();
    snap.forEach(d=>{
      const p = d.data();
      if(p.status === 'Received'){ approvedMonthsSet.add(p.forMonth); }
    });
  }catch(err){ /* non-fatal */ }

  const monthSelect = document.getElementById('p_forMonth');
  monthSelect.innerHTML = `
    <option value="${monthKey(0)}">${monthLabel(0)} (this month)</option>
    <option value="${monthKey(1)}">${monthLabel(1)} (advance)</option>
    <option value="${monthKey(2)}">${monthLabel(2)} (advance)</option>
  `;
  monthSelect.addEventListener('change', checkBlocked);
  checkBlocked();

  document.getElementById('loadingState').classList.add('hidden');
  document.getElementById('mainContent').classList.remove('hidden');
});

function checkBlocked(){
  const forMonth = document.getElementById('p_forMonth').value;
  const notice = document.getElementById('blockedNotice');
  const btn = document.getElementById('paymentSubmitBtn');
  if(approvedMonthsSet.has(forMonth)){
    notice.textContent = "You've already paid for this month and it's been confirmed — no need to pay again.";
    notice.style.display = 'block';
    btn.disabled = true;
  }else{
    notice.style.display = 'none';
    btn.disabled = false;
  }
}

const methodBkash = document.getElementById('method_bkash');
const methodPerson = document.getElementById('method_person');
const methodBkashOpt = document.getElementById('methodBkashOpt');
const methodPersonOpt = document.getElementById('methodPersonOpt');
const bkashFields = document.getElementById('bkashFields');
const personFields = document.getElementById('personFields');
function updateMethodUI(){
  methodBkashOpt.classList.toggle('active', methodBkash.checked);
  methodPersonOpt.classList.toggle('active', methodPerson.checked);
  bkashFields.classList.toggle('hidden', !methodBkash.checked);
  personFields.classList.toggle('hidden', !methodPerson.checked);
}
methodBkash.addEventListener('change', updateMethodUI);
methodPerson.addEventListener('change', updateMethodUI);
methodBkashOpt.addEventListener('click', ()=>{ methodBkash.checked = true; updateMethodUI(); });
methodPersonOpt.addEventListener('click', ()=>{ methodPerson.checked = true; updateMethodUI(); });

function markValid(el){ el.classList.remove('invalid'); }
function markInvalid(el){ el.classList.add('invalid'); }
function val(id){ return document.getElementById(id).value.trim(); }

document.getElementById('paymentForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const form = this;
  let valid = true;
  const statusMsg = document.getElementById('paymentStatus');
  statusMsg.style.display = 'none';

  const forMonth = document.getElementById('p_forMonth').value;
  if(approvedMonthsSet.has(forMonth)){ return; }

  const method = methodBkash.checked ? 'bKash' : (methodPerson.checked ? 'Person' : '');
  const methodField = form.querySelector('[data-field="method"]');
  if(!method){ markInvalid(methodField); valid = false; } else { markValid(methodField); }

  let txnId = '', txnPhone = '', personName = '';
  const bkashErr = document.getElementById('bkashErr');
  bkashErr.style.display = 'none';

  if(method === 'bKash'){
    txnId = val('p_txnId');
    txnPhone = val('p_txnPhone');
    if(!txnId && !txnPhone){
      bkashErr.style.display = 'block';
      valid = false;
    }
  }else if(method === 'Person'){
    personName = val('p_personName');
    const personField = form.querySelector('[data-field="personName"]');
    if(!personName){ markInvalid(personField); valid = false; } else { markValid(personField); }
  }

  const amount = val('p_amount');
  const amountField = form.querySelector('[data-field="amount"]');
  if(!amount || Number(amount) <= 0){ markInvalid(amountField); valid = false; } else { markValid(amountField); }

  if(!valid){
    statusMsg.textContent = 'Please fill in the highlighted fields.';
    statusMsg.className = 'status error';
    statusMsg.style.display = 'block';
    return;
  }

  const btn = document.getElementById('paymentSubmitBtn');
  btn.disabled = true; btn.textContent = 'Submitting...';

  try{
    await db.collection('payments').add({
      studentUid: currentUid,
      studentName: currentStudentData.fullname || '',
      rollNumber: currentStudentData.rollNumber || '',
      forMonth, method, txnId, txnPhone, personName,
      amount: Number(amount),
      status: 'Pending',
      submittedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    statusMsg.textContent = 'Payment submitted — it will show as Pending until confirmed.';
    statusMsg.className = 'status ok';
    statusMsg.style.display = 'block';
    form.reset();
    document.querySelectorAll('#paymentForm .field').forEach(f=>f.classList.remove('invalid'));
    bkashFields.classList.add('hidden');
    personFields.classList.add('hidden');
  }catch(err){
    statusMsg.textContent = 'Something went wrong. Please try again.';
    statusMsg.className = 'status error';
    statusMsg.style.display = 'block';
  }
  btn.disabled = false; btn.textContent = 'Submit Payment';
});
</script>
</body>
</html>
